<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>notation gallery</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #fff; color: #000; }
      h1 { margin: 16px 8px 4px; font-size: 18px; }
      h2 { margin: 24px 8px 4px; font-size: 16px; }
      .figure { margin: 0 8px 24px; }
      .figure h3 { margin: 0 0 4px; font-size: 13px; font-weight: 600; color: #333; }

      .host { position: relative; border: 1px solid #ddd; overflow-x: auto; }
      pre { padding: 8px; white-space: pre-wrap; }

  </head>
  <body>
    <h1>Gallery — one section per notation, checked against its sentence</h1>
    <pre id="log"></pre>
    <div id="sections"></div>
